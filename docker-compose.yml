version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: buildnexus_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: buildnexus_backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/manufacturing_intelligence
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ML_SERVICE_URL=http://ml-services:5001
      - PORT=5000
    depends_on:
      - mongodb
      - ml-services
    restart: unless-stopped

  ml-services:
    build:
      context: ./ml-services
    container_name: buildnexus_ml
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: buildnexus_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
